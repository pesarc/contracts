[profile.default]
src = "src"
out = "out"
libs = ["lib"]
solc = "0.8.26"
via_ir = true
optimizer = true
optimizer_runs = 200
remappings = [
  "forge-std/=lib/forge-std/src/",
  "openzeppelin-contracts/=lib/openzeppelin-contracts/",
  "@openzeppelin/=lib/openzeppelin-contracts/",
  "@account-abstraction/=lib/account-abstraction/",
  "v4-core/=lib/v4-core/src/",
  "solmate/=lib/solmate/",
  "@hyperbridge/core/=node_modules/@hyperbridge/core/contracts/",
  "@polytope-labs/=node_modules/@polytope-labs/",
]

[rpc_endpoints]
celo = "https://forno.celo.org"
celo_sepolia = "${NEXT_PUBLIC_CELO_RPC_URL}"
arbitrum = "${ARBITRUM_RPC_URL}"
arbitrum_sepolia = "${NEXT_PUBLIC_ARB_SEPOLIA_RPC_URL}"
# EVM corridor chains. These are public RPC defaults so simulation works out of
# the box; for a real broadcast pass a paid RPC to forge directly with
# `--rpc-url <full-url>` (a flaky public RPC can drop a mid-broadcast tx).
base = "https://mainnet.base.org"
optimism = "https://mainnet.optimism.io"
polygon = "https://polygon-rpc.com"
# Circle Arc — USDC is the native gas token (docs.arc.io).
arc = "https://rpc.mainnet.arc.io"
arc_testnet = "https://rpc.testnet.arc.io"
