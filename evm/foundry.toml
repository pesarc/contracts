[profile.default]
src = "src"
out = "out"
libs = ["lib"]
solc = "0.8.26"
via_ir = true
optimizer = true
optimizer_runs = 200
remappings = [
  "forge-std/=lib/forge-std/src/",
  "openzeppelin-contracts/=lib/openzeppelin-contracts/",
]

[rpc_endpoints]
celo = "https://forno.celo.org"
celo_sepolia = "${NEXT_PUBLIC_CELO_RPC_URL}"
arbitrum = "${ARBITRUM_RPC_URL}"
